<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Itzel & Raúl · Nuestra Boda</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Parisienne&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root{
            --sage-900:#33402d;
            --sage-800:#425339;
            --sage-700:#526645;
            --sage-600:#6a7f58;
            --sage-500:#84976f;
            --sage-400:#a3b48d;
            --sage-300:#c3d2ae;
            --sage-200:#dde7cd;
            --sage-150:#e9f0dd;
            --sage-100:#f2f6ea;
            --cream:#faf8f2;
            --white:#ffffff;
            --gold:#b6a06a;
            --ink:#333c2c;
        }
        *{ margin:0; padding:0; box-sizing:border-box; }

        html{ scroll-behavior:smooth; }

        body{
            background:var(--cream);
            font-family:'Cormorant Garamond', serif;
            font-size:1.15rem;
            color:var(--ink);
            line-height:1.6;
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
            padding:20px;
        }

        .wedding-container{
            position:relative;
            max-width:1000px;
            width:100%;
            margin:0 auto;
            background:var(--white);
            border-radius:48px;
            box-shadow:0 30px 60px -15px rgba(51,64,45,0.25);
            overflow:hidden;
        }

        /* ===================== ENVELOPE INTRO ===================== */
        .envelope-screen{
            position:fixed;
            inset:0;
            z-index:999;
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:flex-start;
padding-top:8vh;
overflow-y:auto;
            gap:28px;
            background:
                radial-gradient(circle at 20% 15%, rgba(255,255,255,0.5), transparent 45%),
                radial-gradient(circle at 85% 85%, rgba(255,255,255,0.35), transparent 50%),
                linear-gradient(160deg, var(--sage-600), var(--sage-800));
            transition:opacity 0.9s ease, visibility 0.9s ease;
        }
        .envelope-screen.closing{ opacity:0; visibility:hidden; pointer-events:none; }
        .envelope-screen .env-kicker{
            font-family:'Poppins', sans-serif;
            letter-spacing:5px;
            font-size:0.75rem;
            color:var(--sage-150);
            text-transform:uppercase;
        }
        .envelope-screen .env-familia{
            font-family:'Playfair Display', serif;
            font-size:1.3rem;
            font-weight:600;
            color:var(--cream);
            margin-bottom:6px;
            letter-spacing:0.5px;
        }
        .envelope-screen .env-familia:empty{
            display:none;
        }
        .envelope-wrap{
            perspective:1400px;
            width:280px;
        }
        .envelope{
            position:relative;
            width:280px;
            height:190px;
        }
        .envelope-back{
            position:absolute;
            inset:0;
            background:var(--sage-100);
            border-radius:14px;
            box-shadow:0 25px 45px rgba(0,0,0,0.28);
            overflow:hidden;
        }
        .envelope-back:before, .envelope-back:after{
            content:'';
            position:absolute;
            bottom:0;
            width:0; height:0;
            border-bottom:96px solid rgba(132,151,111,0.35);
        }
        .envelope-back:before{
            left:0;
            border-left:140px solid transparent;
            border-right:0;
        }
        .envelope-back:after{
            right:0;
            border-right:140px solid transparent;
            border-left:0;
        }
        .envelope-card{
            position:absolute;
            left:10px; right:10px; bottom:10px;
            top:34px;
            background:var(--white);
            border-radius:10px;
            box-shadow:0 6px 18px rgba(0,0,0,0.12);
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:center;
            text-align:center;
            padding:10px;
	    opacity:0;
            transform:translateY(6%);
            transition:transform 0.9s ease 0.15s;
            z-index:1;
        }
        .envelope-card .brand-script{ font-size:1.5rem; color:var(--sage-700); }
        .envelope-card .env-sub{
            font-family:'Poppins', sans-serif;
            font-size:0.65rem;
            letter-spacing:2px;
            color:var(--sage-500);
            text-transform:uppercase;
            margin-top:4px;
        }
        .envelope-flap{
            position:absolute;
            top:0.4px; left:5px;
            width:100%; height:102px;
            background:var(--sage-300);
            clip-path: polygon(0 0, 96% 0, 50% 98%);
            transform-origin:top center;
            transition:transform 1s cubic-bezier(.6,.1,.3,1);
            z-index:3;
            filter:drop-shadow(0 4px 6px rgba(0,0,0,0.15));
        }
        .envelope-wrap.open .envelope-flap{ transform:rotateX(180deg); }
        .envelope-wrap.open .envelope-card{ transform:translateY(-18%); opacity:1; }
        .envelope-seal{
            position:absolute;
            top:90px; left:50%;
            transform:translate(-50%,-50%);
            width:56px; height:56px;
            border-radius:50%;
            background:radial-gradient(circle at 35% 30%, #cdbb85, var(--gold));
            display:flex;
            align-items:center;
            justify-content:center;
            font-family:'Parisienne', cursive;
            font-size:1.3rem;
            color:#fffdf6;
            box-shadow:0 6px 14px rgba(0,0,0,0.25);
            z-index:4;
            cursor:pointer;
            transition:transform 0.25s ease, opacity 0.5s ease;
            animation:pulseSeal 2.4s ease-in-out infinite;
        }
        .envelope-wrap.open .envelope-seal{ opacity:0; transform:translate(-50%,-50%) scale(0.4); }
        @keyframes pulseSeal{
            0%,100%{ box-shadow:0 6px 14px rgba(0,0,0,0.25), 0 0 0 0 rgba(255,255,255,0.35); }
            50%{ box-shadow:0 6px 14px rgba(0,0,0,0.25), 0 0 0 10px rgba(255,255,255,0); }
        }
        .envelope-hint{
            font-family:'Poppins', sans-serif;
            font-size:0.85rem;
            color:var(--sage-150);
            letter-spacing:1px;
        }
        .envelope-btn{
            font-family:'Poppins', sans-serif;
            background:var(--sage-100);
            color:var(--sage-800);
            border:none;
            padding:12px 30px;
            border-radius:40px;
            font-size:0.85rem;
            letter-spacing:1px;
            cursor:pointer;
            box-shadow:0 8px 18px rgba(0,0,0,0.2);
            transition:all 0.3s;
        }
        .envelope-btn:hover{ background:var(--white); transform:translateY(-2px); }

        /* ===================== HERO ===================== */
        .hero-cover{
            position:relative;
            height:78vh;
            min-height:520px;
            background-size:cover;
            background-position:center 35%;
            display:flex;
            align-items:center;
            justify-content:center;
            text-align:center;
            color:white;
        }
        .hero-overlay{
            position:absolute; inset:0;
            background:linear-gradient(180deg, rgba(51,64,45,0.35) 0%, rgba(51,64,45,0.55) 60%, rgba(51,64,45,0.8) 100%);
        }
        .hero-content{ position:relative; z-index:2; padding:20px; }
        .hero-content .kicker{
            font-family:'Poppins', sans-serif;
            font-size:1.5rem;
            font-weight:400;
            letter-spacing:7px;
            margin-bottom:18px;
            text-transform:uppercase;
            color:var(--sage-150);
        }
        .hero-content .brand-script{
            font-family:'Parisienne', cursive;
            font-size:7rem;
            font-weight:400;
            line-height:1.15;
            margin:8px 0 4px;
            color:#ffffff;
            text-shadow:0 6px 24px rgba(0,0,0,0.35);
        }
        .hero-content .amp{ font-size:2.6rem; opacity:0.85; padding:0 6px; }
        .hero-content .hero-date{
            font-family:'Poppins', sans-serif;
            letter-spacing:3px;
            font-size:0.95rem;
            margin-top:6px;
            color:var(--sage-100);
        }
        .btn-play{
            background:rgba(255,255,255,0.15);
            backdrop-filter:blur(6px);
            border:1.5px solid rgba(255,255,255,0.8);
            width:60px; height:60px;
            border-radius:50%;
            display:inline-flex; align-items:center; justify-content:center;
            font-size:22px;
            cursor:pointer;
            margin:26px 0 10px;
            transition:all 0.3s;
            color:white;
        }
        .btn-play:hover{ background:white; color:var(--sage-700); transform:scale(1.06); }

        .leaf-divider{ display:flex; justify-content:center; padding:6px 0 0; opacity:0.7; }

        .section{ padding:64px 24px; max-width:860px; margin:0 auto; text-align:center; }
        .section-kicker{
            font-family:'Poppins', sans-serif;
            font-size:0.72rem;
            letter-spacing:4px;
            text-transform:uppercase;
            color:var(--sage-500);
            margin-bottom:10px;
        }
        .section-title{
            font-family:'Playfair Display', serif;
            font-size:2.1rem;
            color:var(--sage-800);
            margin-bottom:36px;
            position:relative;
            display:inline-block;
        }
        .section-title:after{
            content:'';
            position:absolute;
            bottom:-14px; left:30%;
            width:40%; height:1.5px;
            background:var(--sage-400);
        }
        .verse{
            font-family:'Cormorant Garamond', serif;
            font-style:italic;
            font-size:1.5rem;
            max-width:640px;
            margin:0 auto 20px;
            color:var(--sage-700);
        }

        .parents-grid, .godparents-grid{
            display:flex; flex-wrap:wrap; justify-content:center; gap:30px; margin:34px 0;
        }
        .card{
            background:var(--sage-100);
            padding:26px 30px;
            border-radius:28px;
            min-width:240px;
            box-shadow:0 8px 20px rgba(51,64,45,0.05);
            border:1px solid var(--sage-200);
            text-align:center;
        }
        .card h4{
            font-family:'Playfair Display', serif;
            font-size:1.2rem;
            color:var(--sage-700);
            margin-bottom:14px;
            font-weight:600;
        }
        .card p{ color:var(--ink); }

        /* Gallery */
        .gallery-grid{
            display:grid;
            grid-template-columns:repeat(6,1fr);
            grid-auto-rows:110px;
            gap:12px;
            margin-top:30px;
        }
        .gallery-item{
            border-radius:20px;
            overflow:hidden;
            border:4px solid var(--white);
            box-shadow:0 10px 24px rgba(51,64,45,0.18);
            transition:transform 0.35s ease;
            background:linear-gradient(160deg, var(--sage-150), var(--sage-300));
            display:flex;
            align-items:center;
            justify-content:center;
        }
        .gallery-item img{ width:100%; height:100%; object-fit:contain; display:block; }
        .gallery-item:hover{ transform:translateY(-4px) scale(1.02); }
        .gallery-item.g1{ grid-column:1 / span 3; grid-row:1 / span 2; }
        .gallery-item.g2{ grid-column:4 / span 3; grid-row:1 / span 2; }
        .gallery-item.g3{ grid-column:1 / span 2; grid-row:3 / span 2; }
        .gallery-item.g4{ grid-column:3 / span 2; grid-row:3 / span 2; }
        .gallery-item.g5{ grid-column:5 / span 2; grid-row:3 / span 2; }

        .date-grid{
            background:var(--sage-100);
            border-radius:44px;
            padding:44px 20px;
            margin:30px 0;
            text-align:center;
        }
        .big-date{
            font-family:'Playfair Display', serif;
            font-size:2.6rem;
            font-weight:700;
            color:var(--sage-800);
            line-height:1.2;
            letter-spacing:1px;
        }
        .date-agenda{
            font-family:'Poppins', sans-serif;
            font-size:0.85rem;
            letter-spacing:1px;
            color:var(--sage-600);
            margin:16px 0 8px;
        }
        .countdown-timer{
            display:flex; justify-content:center; gap:18px; flex-wrap:wrap; margin:30px 0 10px;
        }
        .time-box{
            background:var(--white);
            padding:16px 18px;
            border-radius:22px;
            min-width:82px;
            box-shadow:0 6px 16px rgba(51,64,45,0.08);
            text-align:center;
        }
        .time-number{ font-size:2.1rem; font-weight:700; color:var(--sage-700); font-family:'Playfair Display', serif; }
        .time-box div:last-child{ font-family:'Poppins', sans-serif; font-size:0.7rem; letter-spacing:1px; text-transform:uppercase; color:var(--sage-500); margin-top:4px; }

        .events-row{ display:flex; flex-wrap:wrap; justify-content:center; gap:26px; margin:36px 0; }
        .event-card{
            flex:1; min-width:260px;
            background:var(--sage-100);
            border-radius:28px;
            padding:26px;
            border:1px solid var(--sage-200);
            text-align:center;
        }
        .event-card h4{ font-family:'Playfair Display', serif; color:var(--sage-800); margin-bottom:6px; font-size:1.15rem; }
        .map-placeholder{ position:relative; height:170px; background:var(--sage-200); border-radius:20px; margin:14px 0 0; overflow:hidden; }
        #mapCeremonia, #mapRecepcion{ height:100%; width:100%; }

        .dress-box{
            background:var(--sage-150);
            border-radius:36px;
            padding:32px;
            margin:36px 0;
            text-align:center;
            border:1px solid var(--sage-200);
        }
        .dress-box h3, .gifts-block h3{ font-family:'Playfair Display', serif; color:var(--sage-800); margin-bottom:8px; }
        .gift-options{ display:flex; flex-wrap:wrap; justify-content:center; gap:18px; margin-top:26px; }
        .gift-card{
            background:var(--white);
            border:1px solid var(--sage-200);
            border-radius:24px;
            padding:20px;
            width:180px;
            text-align:center;
            box-shadow:0 4px 12px rgba(51,64,45,0.06);
            font-family:'Poppins', sans-serif;
            font-size:0.95rem;
            color:var(--sage-800);
        }

        .rsvp-modern{
            background:linear-gradient(155deg, var(--sage-100), var(--sage-150));
            border-radius:44px;
            padding:42px 30px;
            margin:50px 0 10px;
            text-align:center;
        }
        .rsvp-modern form{ max-width:500px; margin:0 auto; text-align:left; }
        .form-group{ margin-bottom:20px; }
        .form-group label{ font-family:'Poppins', sans-serif; font-weight:500; font-size:0.85rem; display:block; margin-bottom:8px; color:var(--sage-800); }
        .form-group input, .form-group select, .form-group textarea{
            width:100%; padding:13px 14px; border-radius:22px;
            border:1px solid var(--sage-300);
            background:var(--white);
            font-family:'Cormorant Garamond', serif;
            font-size:1.05rem;
            color:var(--ink);
        }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus{
            outline:none; border-color:var(--sage-600);
        }
        .form-group input:disabled, .form-group select:disabled, .form-group textarea:disabled{
            background:var(--sage-150); cursor:not-allowed;
        }
        .btn-submit{
            font-family:'Poppins', sans-serif;
            background:var(--sage-700);
            color:white; border:none; padding:14px 30px; border-radius:40px;
            font-weight:500; cursor:pointer; width:100%; font-size:1rem;
            letter-spacing:0.5px;
            transition:all 0.3s;
        }
        .btn-submit:hover:not(:disabled){ background:var(--sage-800); transform:scale(1.02); }
        .btn-submit:disabled{ background:#b7c2ac; cursor:not-allowed; }

        .confirmado-badge{
            background:#e4efd9; color:var(--sage-800);
            text-align:center; padding:16px; border-radius:28px; margin-bottom:22px;
            border:1px solid var(--sage-300);
        }

        .music-control{
            position:fixed; bottom:25px; right:25px;
            background:var(--sage-700); width:52px; height:52px; border-radius:50%;
            display:flex; align-items:center; justify-content:center; cursor:pointer;
            color:white; font-size:22px; z-index:99;
            box-shadow:0 6px 16px rgba(51,64,45,0.35);
            transition:all 0.3s;
        }
        .music-control:hover{ transform:scale(1.06); background:var(--sage-800); }

        footer{
            background:var(--sage-800);
            color:var(--sage-100);
            text-align:center; padding:34px;
            font-family:'Poppins', sans-serif;
            font-size:0.8rem;
        }
        footer .foot-script{ font-family:'Parisienne', cursive; font-size:1.5rem; color:white; display:block; margin-bottom:6px; }

        .error-card{ text-align:center; padding:60px 30px; background:white; border-radius:48px; }
        .error-card h2{ color:var(--sage-700); margin-bottom:20px; font-family:'Playfair Display', serif; }

        @media (max-width:700px){
            .hero-content .brand-script{ font-size:3rem; }
            .hero-content .kicker{ font-size:0.7rem; letter-spacing:4px; }
            .big-date{ font-size:1.9rem; }
            .section-title{ font-size:1.6rem; }
            .section{ padding:44px 18px; }
            .time-number{ font-size:1.5rem; }
            .time-box{ min-width:62px; padding:10px; }
            .gallery-grid{ grid-template-columns:repeat(2,1fr); grid-auto-rows:130px; }
            .gallery-item.g1{ grid-column:1 / span 2; grid-row:1 / span 2; }
            .gallery-item.g2{ grid-column:1 / span 2; grid-row:3 / span 2; }
            .gallery-item.g3{ grid-column:1 / span 1; grid-row:5 / span 1; }
            .gallery-item.g4{ grid-column:2 / span 1; grid-row:5 / span 1; }
            .gallery-item.g5{ grid-column:1 / span 2; grid-row:6 / span 2; }
            .envelope-wrap, .envelope{ width:240px; }
            .envelope-back:before, .envelope-back:after{ border-left-width:120px; border-right-width:120px; border-bottom-width:82px; }
            .envelope-flap{ height:82px; }
        }
    </style>
</head>
<body>

<!-- ===================== ENVELOPE INTRO ===================== -->
<div class="envelope-screen" id="envelopeScreen">
    <div class="env-familia" id="envFamilia"></div>
    <div class="env-kicker">Tienes una invitación especial</div>
    <div class="envelope-wrap" id="envelopeWrap">
        <div class="envelope">
            <div class="envelope-card">
                <div class="brand-script">Itzel &amp; Raúl</div>
                <div class="env-sub">03 · Abril · 2027</div>
            </div>
            <div class="envelope-back"></div>
            <div class="envelope-flap"></div>
            <div class="envelope-seal" id="envelopeSeal">I·R</div>
        </div>
    </div>
    <div class="envelope-hint">Toca el sello para abrir</div>
    <button class="envelope-btn" id="envelopeBtn">Abrir invitación</button>
</div>

<div id="appRoot"></div>
<div class="music-control" id="musicToggle">🔇</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    // ============================================================
    // 1. PARÁMETROS URL Y VALIDACIÓN
    // ============================================================

    const urlParams = new URLSearchParams(window.location.search);
    const familiaParam = urlParams.get('familia') || '';
    const tokenParam = urlParams.get('token') || '';

    // Muestra el nombre de la familia en el sobre, si viene en el link
    const envFamiliaEl = document.getElementById('envFamilia');
    if (envFamiliaEl && familiaParam) {
        envFamiliaEl.textContent = 'Familia ' + familiaParam;
    }

    // Mismo backend de Google Apps Script sirve la lista de invitados (GET)
    // y guarda las confirmaciones (POST). Ver Code.gs / instrucciones aparte.
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyi-kvEK4F4VAkTzewtLEgUvepkyYfOYMPrqIvBWOTbylhLtLjUumPyqGy5Sl4cf3vbBQ/exec';

    let datosFamilia = null;
    let errorMotivo = null;
    let STORAGE_KEY = '';
    let yaConfirmo = false;

    const app = document.getElementById('appRoot');
    app.innerHTML = `
        <div class="wedding-container">
            <div class="error-card">
                <h2>💌 Cargando tu invitación…</h2>
            </div>
        </div>
    `;

    async function cargarInvitados() {
        const response = await fetch(SCRIPT_URL);
        const data = await response.json();
        if (!data || !data.invitados) throw new Error('Respuesta inválida de la hoja de invitados');
        return data.invitados;
    }

    async function iniciar() {
        let FAMILIAS_AUTORIZADAS = {};
        try {
            FAMILIAS_AUTORIZADAS = await cargarInvitados();
        } catch (e) {
            errorMotivo = 'No se pudo cargar la lista de invitados. Revisa tu conexión e intenta de nuevo.';
            renderWedding();
            return;
        }

        if (familiaParam && tokenParam) {
            const familiaEncontrada = FAMILIAS_AUTORIZADAS[familiaParam];
            if (familiaEncontrada && familiaEncontrada.token === tokenParam) {
                datosFamilia = {
                    nombre: familiaParam,
                    cupo: familiaEncontrada.cupo,
                    token: tokenParam
                };
            } else if (!familiaEncontrada) {
                errorMotivo = "Familia no autorizada";
            } else {
                errorMotivo = "Token inválido para esta familia";
            }
        } else {
            // Sin parámetros en la URL: modo vista previa, para poder abrir
            // la página directamente (sin link personalizado) y revisar avances.
            const previewNombre = "Itzel y Raúl";
            const previewData = FAMILIAS_AUTORIZADAS[previewNombre];
            if (previewData) {
                datosFamilia = {
                    nombre: previewNombre,
                    cupo: previewData.cupo,
                    token: previewData.token
                };
            } else {
                errorMotivo = 'Falta la fila "Itzel y Raúl" en la hoja de Invitados (se usa para la vista previa sin link).';
            }
        }

        if (datosFamilia) {
            STORAGE_KEY = 'rsvp_confirmado_' + datosFamilia.nombre;
            yaConfirmo = localStorage.getItem(STORAGE_KEY) === 'true';
        }

        renderWedding();
    }


    // ============================================================
    // 2. RENDERIZADO PRINCIPAL
    // ============================================================

    function renderWedding() {
        const fechaBoda = new Date("April 03, 2027 13:00:00");

        // Error de validación

    function escapeHtml(str) {
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    function iniciarCuentaRegresiva(fechaBoda) {
        function updateTimer() {
            const now = new Date().getTime();
            const diff = fechaBoda - now;
            if (diff <= 0) {
                const widget = document.getElementById('countdownWidget');
                if (widget) widget.innerHTML = '<div style="padding:20px;">🎉 ¡Es hoy! 🎉</div>';
                return;
            }
            const days = Math.floor(diff / (1000*60*60*24));
            const hours = Math.floor((diff % 86400000) / 3600000);
            const mins = Math.floor((diff % 3600000) / 60000);
            const secs = Math.floor((diff % 60000) / 1000);
            if (document.getElementById('days')) document.getElementById('days').innerText = days;
            if (document.getElementById('hours')) document.getElementById('hours').innerText = hours;
            if (document.getElementById('minutes')) document.getElementById('minutes').innerText = mins;
            if (document.getElementById('seconds')) document.getElementById('seconds').innerText = secs;
        }
        updateTimer();
        setInterval(updateTimer, 1000);
    }

const response = await fetch(SCRIPT_URL, {

    function iniciarMusica() {
        const audio = new Audio('cepeda.mp3');
        audio.loop = true;
        audio.volume = 0.4;
        let isPlaying = false;

        const toggleBtn = document.getElementById('musicToggle');
        const playBtn = document.getElementById('playMusicBtn');

        function startMusic() {
            if (!isPlaying) {
                audio.play().then(() => {
                    isPlaying = true;
                    if (toggleBtn) toggleBtn.innerHTML = '🔊';
                    if (playBtn) playBtn.innerHTML = '⏸';
                }).catch(e => console.log("Autoplay bloqueado"));
            }
        }

        if (toggleBtn) {
            toggleBtn.addEventListener('click', () => {
                if (isPlaying) {
                    audio.pause();
                    isPlaying = false;
                    toggleBtn.innerHTML = '🔇';
                    if (playBtn) playBtn.innerHTML = '🎵';
                } else {
                    audio.play().then(() => {
                        isPlaying = true;
                        toggleBtn.innerHTML = '🔊';
                        if (playBtn) playBtn.innerHTML = '⏸';
                    }).catch(() => alert("Haz clic en la página para activar música"));
                }
            });
        }

        if (playBtn) {
            playBtn.addEventListener('click', () => {
                if (isPlaying) {
                    audio.pause();
                    isPlaying = false;
                    playBtn.innerHTML = '🎵';
                    if (toggleBtn) toggleBtn.innerHTML = '🔇';
                } else {
                    startMusic();
                }
            });
        }

        // Exponer para que el sobre pueda iniciar la música al abrir.
        window.__startWeddingMusic = startMusic;

        document.body.addEventListener('click', startMusic, { once: true });
    }

    iniciar();

    (function initEnvelope(){
        const screen = document.getElementById('envelopeScreen');
        const wrap = document.getElementById('envelopeWrap');
        const seal = document.getElementById('envelopeSeal');
        const btn = document.getElementById('envelopeBtn');
        if (!screen || !wrap) return;

        function openEnvelope() {
            wrap.classList.add('open');
            if (typeof window.__startWeddingMusic === 'function') {
                window.__startWeddingMusic();
            }
            setTimeout(() => {
                screen.classList.add('closing');
                document.body.style.overflow = '';
            }, 750);
        }

        document.body.style.overflow = 'hidden';
        seal.addEventListener('click', openEnvelope);
        btn.addEventListener('click', openEnvelope);
        setTimeout(() => {
            if (screen.classList.contains('closing')) document.body.style.overflow = '';
        }, 2000);
    })();
